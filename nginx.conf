server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cross-origin isolation: lets the in-browser ONNX model use
    # multi-threaded WebAssembly (SharedArrayBuffer).
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;

    # Single-page app — fall back to index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reasonable caching for hashed build assets.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        # add_header in a location block replaces the server-level ones.
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
}
