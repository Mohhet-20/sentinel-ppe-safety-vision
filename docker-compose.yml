# Sentinel — production-style local deployment.
#
#   cp backend/.env.example backend/.env   # edit SECRET_KEY etc. before real use
#   docker compose up --build
#
# Frontend: http://localhost:8080
# Backend:  http://localhost:8000  (docs at /docs)
#
# Drop a trained checkpoint at ./backend/models/best.pt (bind-mounted below)
# and it's picked up automatically — no rebuild needed.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        INSTALL_AI: "1"
    image: sentinel-backend:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      CORS_ORIGINS: "http://localhost:8080,http://localhost:5173"
      DATABASE_URL: "sqlite:////app/data/sentinel.db"
    volumes:
      - ./backend/models:/app/models
      - backend_uploads:/app/uploads
      - backend_reports:/app/reports
      - backend_logs:/app/logs
      - backend_db:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "http://localhost:8000/api"
    image: sentinel-frontend:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  backend_uploads:
  backend_reports:
  backend_logs:
  backend_db:
